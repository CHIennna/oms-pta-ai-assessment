services:
  - type: web
    name: oms-pta-ai-assessment
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: oms-auth-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OMS_AUTH_DATA_DIR
        value: /var/data/oms-auth
      - key: OMS_AUTH_PERSISTENT_STORAGE
        value: "1"
      - key: OMS_PUBLIC_ORIGIN
        value: https://oms-pta-ai-assessment.onrender.com
      - key: JUDGE_MAX_CONCURRENCY
        value: "2"
      - key: JUDGE_MAX_QUEUE
        value: "20"
      - key: JUDGE_COMPILE_TIMEOUT_MS
        value: "15000"
      - key: JUDGE_RUN_TIMEOUT_MS
        value: "2000"
      - key: JUDGE_MEMORY_LIMIT_KB
        value: "262144"
      - key: JUDGE_OUTPUT_LIMIT_BYTES
        value: "65536"
      - key: JUDGE_USE_PRLIMIT
        value: "1"
