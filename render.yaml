services:
  - type: web
    name: oms-pta-ai-assessment
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: JUDGE_MAX_CONCURRENCY
        value: "2"
      - key: JUDGE_MAX_QUEUE
        value: "20"
      - key: JUDGE_COMPILE_TIMEOUT_MS
        value: "15000"
      - key: JUDGE_RUN_TIMEOUT_MS
        value: "2000"
      - key: JUDGE_MEMORY_LIMIT_KB
        value: "262144"
      - key: JUDGE_OUTPUT_LIMIT_BYTES
        value: "65536"
      - key: JUDGE_USE_PRLIMIT
        value: "1"
