<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OMS 内嵌 PTA 程序评测工作台" />
  <title>程序设计基础上机考试 · OMS</title>
  <link rel="stylesheet" href="pta-clone.css" />
  <link rel="stylesheet" href="pta-clone-fix.css" />
  <link rel="stylesheet" href="pta-clone-interactions.css" />
  <link rel="stylesheet" href="code-highlight.css" />
  <link rel="stylesheet" href="judge-machine.css" />
  <link rel="stylesheet" href="pta-geometry.css" />
</head>
<body>
  <div id="pta-app" class="pta-app">
    <header class="topbar">
      <div class="brand"><button class="round" title="返回">←</button><strong id="exam-name">程序设计基础上机考试</strong><span class="oms-chip">OMS 监控中</span></div>
      <div class="machine-info"><span><i></i>上机号 <b id="seat">PC-08</b></span><span>姓名 <b id="candidate">陈小雅</b></span><span>学号 <b id="student-id">202401050128</b></span><span class="remain">剩余 <b id="countdown">01:30:00</b></span></div>
      <div class="account"><button class="round" title="公告">▣</button><button class="round" title="设置">⚙</button><button id="open-admin" class="admin-button">考试管理</button><span class="avatar">CY</span><b>ciena</b></div>
    </header>
    <nav class="rail" aria-label="考试导航">
      <button class="rail-button active" data-route="exam"><span>▤</span><small>题目<br>列表</small></button>
      <button class="rail-button" data-route="submissions"><span>☷</span><small>提交<br>列表</small></button>
      <button class="rail-button" data-route="info"><span>ⓘ</span><small>考试<br>信息</small></button>
      <button class="rail-button" data-route="students"><span>♚</span><small>考生<br>情况</small></button>
    </nav>
    <aside id="overview" class="overview">
      <div class="overview-head"><b>题目总览</b><span>作答 / 题数</span></div>
      <button class="category"><span>⌁&nbsp; 编程题</span><em id="answer-count">0 / 5</em></button>
      <div class="matrix-head"><b>编程题</b><span>ⓘ 图例</span></div><div id="question-grid" class="question-grid"></div>
    </aside>
    <main id="workspace" class="workspace">
      <div class="workspace-bar"><button id="overview-toggle" class="collapse-toggle" title="收起题目总览">▯</button><button class="crumb">‹&nbsp; 编程题</button><strong id="bar-title">1003 个位数统计</strong><div><button id="previous">‹&nbsp; 上一题</button><button id="next">下一题&nbsp; ›</button></div></div>
      <div class="description-tab">题目描述</div>
      <div class="workspace-middle">
        <section class="statement"><div class="statement-inner"><div class="problem-meta"><div><h1 id="problem-title">1003 个位数统计</h1><span id="score">分数 20</span></div><div class="problem-tools"><button>全屏浏览</button><button>切换布局</button><span>作者 OMS 教研组</span></div></div><div id="problem-text"></div></div></section>
        <div class="resize-handle"><i></i></div>
        <section class="coding"><div class="editor-toolbar"><select id="language"><option>C++ (g++)</option><option>Python 3</option><option>Java 17</option></select><i></i><button>⚙</button><button>?</button><button>⛶</button></div><div class="editor"><pre id="lines"></pre><textarea id="code" spellcheck="false" aria-label="代码编辑器"></textarea></div></section>
      </div>
      <section id="tester" class="tester"><div class="tester-tabs"><button class="active" data-tab="test">测试用例</button><button data-tab="compiler">编译器输出</button><span>?</span><button id="tester-toggle">⌃</button></div><div id="test-content" class="test-content"><label>标准输入<textarea id="sample-input">100311</textarea></label><label>预期输出<pre id="expected">0:2\n1:3\n3:1</pre></label><div class="test-actions"><button id="reset-test">重置测试用例</button><button id="run-test">▷ 运行测试</button><small id="run-state">等待运行</small></div></div><pre id="compiler-output" class="compiler-output">暂无编译器输出。</pre></section>
      <footer class="submit-bar"><span id="submit-state">无提交记录</span><button id="submit">提交本题作答</button></footer>
    </main>
    <main id="secondary" class="secondary" hidden></main>
  </div>
  <dialog id="admin-dialog"><form id="admin-form"><button type="button" class="close">×</button><p>OMS 管理员设置</p><h2>考试配置</h2><div class="form-grid"><label>考试标题<input name="title" required /></label><label>考试时长（分钟）<input name="duration" type="number" min="5" required /></label><label>机位号<input name="seat" required /></label><label>考生姓名<input name="candidateName" required /></label><label>考生学号<input name="studentId" required /></label><label>考试人数<input name="registered" type="number" min="1" required /></label></div><div class="import-row"><label>导入外部试题<input id="import-file" type="file" accept=".md,.json,.csv,text/markdown,application/json,text/csv" /></label><small>支持 Markdown、JSON、CSV；Markdown 自动识别题号、题名和分值。</small></div><div id="import-note"></div><div id="question-settings"></div><div class="form-actions"><button class="cancel" type="button">取消</button><button class="save" type="submit">保存并应用</button></div></form></dialog>
  <script src="pta-clone.js"></script>
  <script src="pta-clone-interactions.js"></script>
  <script src="code-highlight.js"></script>
  <script src="judge-machine.js"></script>
  <script src="pta-geometry.js"></script>
</body>
</html>
